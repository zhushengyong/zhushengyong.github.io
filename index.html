<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机车部落 - 摩托车爱好者之家</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
        body{background:#0a0a0a;color:#fff;overflow-x:hidden;}
        /* 导航栏 */
        .nav{width:100%;height:70px;background:rgba(0,0,0,0.7);position:fixed;top:0;z-index:999;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #ff3333;}
        .logo{font-size:24px;font-weight:bold;color:#ff3333;letter-spacing:2px;}
        .nav-list a{color:#fff;text-decoration:none;margin:0 15px;font-size:16px;transition:0.3s;}
        .nav-list a:hover{color:#ff3333;}
        /* 头部横幅 */
        .banner{width:100%;height:100vh;background:url('https://img0.baidu.com/it/u=1801215321,3237135219&fm=253&fmt=auto&app=138&f=JPEG?w=1200&h=675') no-repeat center center;background-size:cover;display:flex;align-items:center;padding-left:8%;position:relative;}
        .banner::after{content:'';width:100%;height:100%;background:rgba(0,0,0,0.5);position:absolute;left:0;top:0;}
        .banner-text{position:relative;z-index:2;}
        .banner-text h1{font-size:55px;margin-bottom:20px;color:#fff;}
        .banner-text h1 span{color:#ff3333;}
        .banner-text p{font-size:18px;color:#ccc;margin-bottom:30px;max-width:500px;}
        .btn{padding:12px 35px;background:#ff3333;color:#fff;border:none;border-radius:30px;font-size:16px;cursor:pointer;transition:0.3s;}
        .btn:hover{background:#cc2222;transform:scale(1.05);}
        /* 车型板块 */
        .car-type{padding:80px 5%;}
        .title{text-align:center;margin-bottom:60px;}
        .title h2{font-size:36px;position:relative;display:inline-block;}
        .title h2::after{content:'';width:60px;height:3px;background:#ff3333;position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);}
        .type-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
        .type-item{background:#151515;border-radius:10px;overflow:hidden;transition:0.4s;}
        .type-item:hover{transform:translateY(-10px);box-shadow:0 10px 30px #ff333333;}
        .type-item img{width:100%;height:200px;object-fit:cover;}
        .type-item .info{padding:20px;}
        .type-item h3{margin-bottom:10px;color:#ff3333;}
        .type-item p{color:#999;font-size:14px;}
        /* 底部 */
        .footer{width:100%;padding:40px 0;background:#000;text-align:center;color:#666;border-top:1px solid #222;}
        /* 适配手机 */
        @media(max-width:768px){
            .nav-list{display:none;}
            .banner-text h1{font-size:35px;}
            .banner{padding-left:5%;}
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <div class="nav">
        <div class="logo">🏍 机车部落</div>
        <div class="nav-list">
            <a href="#">首页</a>
            <a href="#">车型大全</a>
            <a href="#">骑行攻略</a>
            <a href="#">机车改装</a>
            <a href="#">车友社区</a>
            <a href="#">联系我们</a>
        </div>
    </div>

    <!-- 首页横幅 -->
    <div class="banner">
        <div class="banner-text">
            <h1>奔赴热爱 <span>驰骋山河</span></h1>
            <p>风是自由的，骑士亦是自由的，以机车赴远方，赴世间所有浪漫</p>
            <button class="btn">即刻入坑 开启骑行</button>
        </div>
    </div>

    <!-- 热门车型 -->
    <div class="car-type">
        <div class="title">
            <h2>热门机车车型</h2>
        </div>
        <div class="type-box">
            <div class="type-item">
                <img src="https://img2.baidu.com/it/u=2678975151,1213256129&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500" alt="仿赛机车">
                <div class="info">
                    <h3>赛道仿赛</h3>
                    <p>速度与激情，极致竞速体验，年轻人首选潮酷机车</p>
                </div>
            </div>
            <div class="type-item">
                <img src="https://img1.baidu.com/it/u=3802520215,2792132229&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500" alt="巡航机车">
                <div class="info">
                    <h3>复古巡航</h3>
                    <p>沉稳大气长途骑行利器，奔赴远方旅途必备车型</p>
                </div>
            </div>
            <div class="type-item">
                <img src="https://img0.baidu.com/it/u=1723111333,3901311255&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500" alt="越野机车">
                <div class="info">
                    <h3>越野拉力</h3>
                    <p>翻山越岭无惧路况，征服山野穿越无人秘境</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
        <p>机车部落 © 2026 摩托车爱好者专属平台 | 安全骑行 文明上路</p>
    </div>
</body>
</html>
